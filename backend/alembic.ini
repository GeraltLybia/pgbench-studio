# Used only for authoring migrations: `uv run alembic revision -m "..."`.
# At runtime the backend applies migrations itself on startup.
[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///./data/studio.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
