name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy app
      - name: pytest
        # -v: one line per test, so the log shows where a run stops.
        run: uv run pytest -v --cov=app --cov-report=json --cov-report=term
      - name: coverage thresholds (core/api 85 %, rest 70 %)
        run: uv run python scripts/check_coverage.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: pgbench 18 from PGDG
        # Same approach as the backend image: client package plus the pgbench binary only.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          cd /tmp && apt-get download postgresql-18 && dpkg-deb -x postgresql-18_*.deb pg18
          echo "PGBENCH_BINARY=/tmp/pg18/usr/lib/postgresql/18/bin/pgbench" >> "$GITHUB_ENV"
      - name: pytest -m integration (PostgreSQL 13 and 18 in Testcontainers)
        run: uv run pytest -m integration -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date
        run: |
          (cd ../backend && uv sync --frozen && uv run studio openapi -o ../frontend/openapi.json)
          pnpm exec openapi-typescript openapi.json -o src/types/api.ts
          git diff --exit-code -- openapi.json src/types/api.ts
      - name: ESLint
        run: pnpm lint
      - name: vue-tsc
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test

  e2e:
    # Playwright against the real stack: nginx + backend images, PostgreSQL 13 and 18.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: test config (local HTTP) and secrets
        run: |
          sed -e 's/^\(  trusted_proxies:\).*/\1 []/' \
              -e 's/^\(  dev_mode:\).*/\1 true/' \
              -e 's/^\(  cookie_secure:\).*/\1 false/' config.example.yaml > config.yaml
          grep -E 'dev_mode: true|cookie_secure: false' config.yaml
          admin_password="$(openssl rand -hex 16)"
          echo "::add-mask::$admin_password"
          cp .env.example .env
          sed -i "s|^PGB_STUDIO_SECRET_KEY=.*|PGB_STUDIO_SECRET_KEY=$(openssl rand -base64 32 | tr '+/' '-_')|" .env
          sed -i "s|^PGB_STUDIO_ADMIN_PASSWORD=.*|PGB_STUDIO_ADMIN_PASSWORD=$admin_password|" .env
          echo "E2E_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
      - name: compose stack
        run: docker compose up -d --build --wait
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright
        run: pnpm e2e
        working-directory: frontend
      - name: stack logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  images:
    runs-on: ubuntu-latest
    needs: [backend, integration, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: pgbench-studio-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: pgbench-studio-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
